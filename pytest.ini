[pytest]
# Carpeta donde viven las pruebas.
testpaths = tests
# Agrega la carpeta del proyecto al camino de Python para poder hacer
# "from app import app" sin instalar nada.
pythonpath = .
# OneDrive a veces bloquea la carpeta .pytest_cache; la desactivamos para que
# la salida de las pruebas salga limpia.
addopts = -p no:cacheprovider
